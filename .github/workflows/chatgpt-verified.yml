name: Apply ChatGPT commits as verified

on:
  push:
    branches:
      - chatgpt-staging

permissions:
  contents: write

concurrency:
  group: chatgpt-verified
  cancel-in-progress: false

env:
  SOURCE_BRANCH: chatgpt-staging
  TARGET_BRANCH: main

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Generate pnpm lockfile and apply commits as GitHub-signed commits
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AFTER: ${{ github.event.after }}
        shell: bash
        run: |
          set -euo pipefail

          git init repo
          cd repo

          git remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch --no-tags origin \
            "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}" \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"

          git checkout -B "$SOURCE_BRANCH" "refs/remotes/origin/${SOURCE_BRANCH}"

          # Generate or refresh pnpm-lock.yaml before anything is replayed to main.
          # --ignore-scripts avoids running arbitrary package lifecycle scripts here.
          if [[ -f package.json ]]; then
            corepack enable
            corepack pnpm install --lockfile-only --ignore-scripts

            if [[ ! -f pnpm-lock.yaml ]]; then
              echo "pnpm did not generate pnpm-lock.yaml."
              exit 1
            fi

            git add -- pnpm-lock.yaml

            if ! git diff --cached --quiet -- pnpm-lock.yaml; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Generate pnpm lockfile"
              git push origin "HEAD:refs/heads/${SOURCE_BRANCH}"
            fi
          fi

          # The lockfile commit above may have advanced chatgpt-staging.
          # Replay through the actual local HEAD rather than only github.event.after.
          AFTER="$(git rev-parse HEAD)"
          MAIN_HEAD="$(git rev-parse "refs/remotes/origin/${TARGET_BRANCH}")"

          # Find the latest source commit that was already replayed onto main.
          # If none exists yet, start at the common ancestor of both branches.
          LAST_SOURCE="$(
            git log "refs/remotes/origin/${TARGET_BRANCH}" --format=%B |
            sed -nE 's/^Source-Commit: ([0-9a-f]{40})$/\1/p' |
            head -n1
          )"

          if [[ -z "$LAST_SOURCE" ]]; then
            LAST_SOURCE="$(
              git merge-base \
                "refs/remotes/origin/${SOURCE_BRANCH}" \
                "refs/remotes/origin/${TARGET_BRANCH}"
            )"
          fi

          if ! git cat-file -e "${LAST_SOURCE}^{commit}" 2>/dev/null; then
            echo "The last applied source commit is no longer reachable: ${LAST_SOURCE}"
            exit 1
          fi

          if ! git merge-base --is-ancestor "$LAST_SOURCE" "$AFTER"; then
            echo "${SOURCE_BRANCH} no longer contains the last applied source commit."
            echo "Refusing to replay a non-linear history."
            exit 1
          fi

          mapfile -t COMMITS < <(
            git rev-list --reverse "${LAST_SOURCE}..${AFTER}"
          )

          if [[ ${#COMMITS[@]} -eq 0 ]]; then
            echo "No commits to apply."
            exit 0
          fi

          for COMMIT in "${COMMITS[@]}"; do
            PARENT="$(git rev-parse "${COMMIT}^")"

            echo "Applying ${COMMIT}"

            : > additions.jsonl
            : > deletions.jsonl

            while IFS= read -r -d '' STATUS &&
                  IFS= read -r -d '' PATHNAME; do

              case "$STATUS" in
                D)
                  jq -cn \
                    --arg path "$PATHNAME" \
                    '{path: $path}' \
                    >> deletions.jsonl
                  ;;

                A|M|T)
                  OLD_MODE="$(
                    git ls-tree "$PARENT" -- "$PATHNAME" |
                    awk '{print $1}'
                  )"

                  ENTRY="$(
                    git ls-tree "$COMMIT" -- "$PATHNAME"
                  )"

                  NEW_MODE="$(
                    printf '%s\n' "$ENTRY" |
                    awk '{print $1}'
                  )"

                  TYPE="$(
                    printf '%s\n' "$ENTRY" |
                    awk '{print $2}'
                  )"

                  if [[ "$TYPE" != "blob" ]]; then
                    echo "Unsupported Git object type for: $PATHNAME ($TYPE)"
                    exit 1
                  fi

                  if [[ "$NEW_MODE" == "120000" ]]; then
                    echo "Symlinks are not supported: $PATHNAME"
                    exit 1
                  fi

                  if [[ -z "$OLD_MODE" && "$NEW_MODE" != "100644" ]]; then
                    echo "New executable/non-standard files are not supported:"
                    echo "$PATHNAME ($NEW_MODE)"
                    exit 1
                  fi

                  if [[ -n "$OLD_MODE" && "$OLD_MODE" != "$NEW_MODE" ]]; then
                    echo "File mode changes are not supported:"
                    echo "$PATHNAME ($OLD_MODE -> $NEW_MODE)"
                    exit 1
                  fi

                  CONTENTS="$(
                    git show "${COMMIT}:${PATHNAME}" |
                    base64 -w0
                  )"

                  jq -cn \
                    --arg path "$PATHNAME" \
                    --arg contents "$CONTENTS" \
                    '{
                      path: $path,
                      contents: $contents
                    }' \
                    >> additions.jsonl
                  ;;

                *)
                  echo "Unsupported diff status: $STATUS $PATHNAME"
                  exit 1
                  ;;
              esac
            done < <(
              git diff \
                --name-status \
                --no-renames \
                -z \
                "$PARENT" \
                "$COMMIT"
            )

            if [[ -s additions.jsonl ]]; then
              ADDITIONS="$(jq -s . additions.jsonl)"
            else
              ADDITIONS='[]'
            fi

            if [[ -s deletions.jsonl ]]; then
              DELETIONS="$(jq -s . deletions.jsonl)"
            else
              DELETIONS='[]'
            fi

            HEADLINE="$(
              git log -1 --format=%s "$COMMIT"
            )"

            BODY="$(
              git log -1 --format=%b "$COMMIT"
            )"

            if [[ -n "$BODY" ]]; then
              BODY="${BODY}"$'\n\n'
            fi

            BODY="${BODY}Source-Commit: ${COMMIT}"

            QUERY='
              mutation($input: CreateCommitOnBranchInput!) {
                createCommitOnBranch(input: $input) {
                  commit {
                    oid
                    url
                  }
                }
              }
            '

            jq -n \
              --arg query "$QUERY" \
              --arg repo "$GITHUB_REPOSITORY" \
              --arg branch "$TARGET_BRANCH" \
              --arg head "$MAIN_HEAD" \
              --arg headline "$HEADLINE" \
              --arg body "$BODY" \
              --argjson additions "$ADDITIONS" \
              --argjson deletions "$DELETIONS" \
              '{
                query: $query,
                variables: {
                  input: {
                    branch: {
                      repositoryNameWithOwner: $repo,
                      branchName: $branch
                    },
                    expectedHeadOid: $head,
                    message: {
                      headline: $headline,
                      body: $body
                    },
                    fileChanges: {
                      additions: $additions,
                      deletions: $deletions
                    }
                  }
                }
              }' > request.json

            RESPONSE="$(
              curl \
                --fail-with-body \
                --silent \
                --show-error \
                -X POST \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Content-Type: application/json" \
                https://api.github.com/graphql \
                --data-binary @request.json
            )"

            if jq -e '.errors != null' >/dev/null <<< "$RESPONSE"; then
              jq '.errors' <<< "$RESPONSE"
              exit 1
            fi

            MAIN_HEAD="$(
              jq -r \
                '.data.createCommitOnBranch.commit.oid' \
                <<< "$RESPONSE"
            )"

            COMMIT_URL="$(
              jq -r \
                '.data.createCommitOnBranch.commit.url' \
                <<< "$RESPONSE"
            )"

            echo "Created: $COMMIT_URL"

            # Ensure GitHub actually considers the generated commit verified.
            VERIFY="$(
              curl \
                --fail-with-body \
                --silent \
                --show-error \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${MAIN_HEAD}"
            )"

            VERIFIED="$(
              jq -r '.commit.verification.verified' <<< "$VERIFY"
            )"

            REASON="$(
              jq -r '.commit.verification.reason' <<< "$VERIFY"
            )"

            if [[ "$VERIFIED" != "true" ]]; then
              echo "Commit was created but is not Verified."
              echo "Reason: $REASON"
              exit 1
            fi

            echo "Verified: ${MAIN_HEAD}"
          done
